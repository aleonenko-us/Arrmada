# Arrmada + bundled qBittorrent + FlareSolverr. Normally started by ./install.sh, which
# writes .env and docker-compose.override.yml. A plain `docker compose up -d` also works:
# it downloads the published image (64-bit Intel/AMD or 64-bit ARM).
# Then open http://localhost:7878  (qBittorrent WebUI: http://localhost:8080, with the login
# an admin sees on its card in Settings → Connections)
services:
  arrmada-app:
    # The image the app runs. With nothing in .env it's the published release, downloaded
    # rather than compiled: compiling takes 30–60 minutes and more memory than a small
    # server has. `docker compose up -d --build` still compiles the code in this folder.
    #
    # Installs made by install.sh or updated by update.sh have ARRMADA_APP_IMAGE=arrmada:dev
    # in .env (the scripts add it): update.sh builds the code here, or downloads the image
    # named by ARRMADA_IMAGE, and tags the result arrmada:dev, keeping the one before as
    # arrmada:previous for ./update.sh --rollback.
    #
    # An install from before this line existed has a .env without it, and a deploy tool
    # (Komodo, say) may run `docker compose up -d` there straight after a git pull, before
    # update.sh has added it. Switching such an install to the published image without a
    # word could start an older version on a newer database, so a .env that has
    # ARRMADA_PORT (every install.sh has written one) but no ARRMADA_APP_IMAGE gets an image
    # name Docker refuses: up, build and pull stop with the message below and leave the
    # running container alone. Add the line to .env and run it again (docs/updating.md).
    image: "${ARRMADA_APP_IMAGE:-${ARRMADA_PORT:+ARRMADA_APP_IMAGE is missing from .env, see docs/updating.md (arrmada:dev builds here, ghcr.io/tristenlammi/arrmada:stable downloads) -- }ghcr.io/tristenlammi/arrmada:stable}"
    build:
      context: .
      # What the build is stamped with (Dashboard, /api/health). update.sh and install.sh
      # export these from git; a plain `docker compose build` falls back to the defaults.
      args:
        VERSION: ${ARRMADA_VERSION:-dev}
        COMMIT: ${ARRMADA_COMMIT:-unknown}
        # A build here runs here, so the Intel oneAPI subtitle build may use every
        # instruction this CPU has (published images are built for any x86-64 CPU).
        # Nothing reads it on ARM. Set ARRMADA_WHISPER_SYCL_NATIVE=0 in .env to turn it off.
        WHISPER_SYCL_NATIVE: ${ARRMADA_WHISPER_SYCL_NATIVE:-1}
    container_name: Arrmada-app
    # x265 binds its worker thread pools to NUMA nodes with set_mempolicy(2), which
    # Docker's default seccomp profile blocks — the encode then logs "set_mempolicy:
    # Operation not permitted" repeatedly and, on some CPUs (notably hybrid P-core/E-core
    # parts), crashes outright. SYS_NICE permits the call so x265 threads normally.
    #
    # The app also detects this at startup and falls back to unpooled threading, so an
    # existing container without this capability still converts — just less efficiently.
    cap_add:
      - SYS_NICE
    ports:
      # Host web-UI port ← .env (install.sh auto-picks a free one so it never clashes
      # with Radarr's 7878 etc.). The app always listens on 7878 *inside* the container.
      - "${ARRMADA_PORT:-7878}:7878"
      # Audiobook server for listening apps (Lissen and other Audiobookshelf clients),
      # switched on in Services → Audiobooks. It listens on 13378 inside; the host port
      # defaults to 13379 so it never collides with an Audiobookshelf still on 13378.
      - "${ARRMADA_AUDIOBOOK_PORT:-13379}:13378"
    environment:
      # Login is always required — there is no way to disable it. First launch shows a
      # one-time "create admin" form.
      # A request carrying this header (a Cloudflare Tunnel / reverse proxy stamps
      # it) is treated as "outside the LAN" and limited to the Discover page.
      ARRMADA_EXTERNAL_HEADER: "${ARRMADA_EXTERNAL_HEADER:-Cf-Connecting-Ip}"
      ARRMADA_LOG_LEVEL: "info"
      # Before any schema change the database is copied to <data>/backups first, and the
      # app won't upgrade if that copy can't be made. Set this to 1 in .env only to get
      # past a data disk too full for the copy.
      ARRMADA_SKIP_MIGRATION_SNAPSHOT: "${ARRMADA_SKIP_MIGRATION_SNAPSHOT:-}"
      # An older build refuses to start on a database a newer one has upgraded (after a
      # rollback without --with-db, say). Set this to 1 in .env only to start it anyway.
      ARRMADA_ALLOW_NEWER_SCHEMA: "${ARRMADA_ALLOW_NEWER_SCHEMA:-}"
      # Which Arrmada updates bring: stable (the published releases) or main (the newest
      # code, compiled here). install.sh and update.sh keep it in .env; the in-app update
      # check compares the running build with the same thing.
      ARRMADA_CHANNEL: "${ARRMADA_CHANNEL:-stable}"
      # The host's timezone (install.sh writes it to .env). Schedules — the Convert encode
      # window, the nightly sweeps, listening-per-day — run on this clock; without it the
      # app ran on UTC while its companions below were already on local time.
      TZ: "${TZ:-Etc/UTC}"
      # Insights can also be pointed at Plex here instead of in its Settings tab.
      ARRMADA_PLEX_URL: "${ARRMADA_PLEX_URL:-}"
      ARRMADA_PLEX_TOKEN: "${ARRMADA_PLEX_TOKEN:-}"
      # The host port above, so the app can show people the address to type.
      ARRMADA_AUDIOBOOK_HOST_PORT: "${ARRMADA_AUDIOBOOK_PORT:-13379}"
      # The bundled qBittorrent companion; auto-registered as a download client. On its
      # first start Arrmada gives it a password (kept in the data folder) and signs in with it.
      ARRMADA_QBITTORRENT_URL: "http://arrmada-qbittorrent:8080"
      # The host port qBittorrent's own page is published on (below), for the link on its card.
      ARRMADA_QBIT_WEBUI_HOST_PORT: "${ARRMADA_QBIT_WEBUI_PORT:-8080}"
      # Bundled FlareSolverr — used to get past Cloudflare on protected trackers.
      ARRMADA_FLARESOLVERR_URL: "http://arrmada-flaresolverr:8191"
      # Optional Prowlarr companion (started only with `--profile prowlarr`). This
      # is just the default URL the "Sync from Prowlarr" button uses; harmless when
      # Prowlarr isn't running.
      ARRMADA_PROWLARR_URL: "http://arrmada-prowlarr:9696"
      # The host port Prowlarr's web UI is published on (below), so the "Open Prowlarr"
      # link points at this install's Prowlarr and not an older one on 9696.
      ARRMADA_PROWLARR_HOST_PORT: "${ARRMADA_PROWLARR_PORT:-9696}"
      # Optional bundled SABnzbd (started only with `--profile sabnzbd`). Arrmada registers
      # it once its config (mounted below) exists, which is only when the profile is on.
      ARRMADA_SABNZBD_URL: "http://arrmada-sabnzbd:8080"
      # The host port SABnzbd's own web page is on, for the "open SABnzbd" link.
      ARRMADA_SABNZBD_HOST_PORT: "${ARRMADA_SABNZBD_PORT:-8085}"
      # Downloads and the library live UNDER ONE shared volume (/media) so imports
      # can hardlink instead of copy: the download keeps seeding while the same
      # bytes appear in the library, costing no extra disk. Hardlinks only work
      # within a single filesystem — that's the whole reason both are subfolders
      # of one mount. (To use one share, e.g. /mnt/user/data, set ARRMADA_MEDIA_HOST in .env.)
      # Default managed library; override in .env (e.g. per-library MOVIES/TV dirs
      # under /storage) to import onto your own array instead of the managed volume.
      ARRMADA_LIBRARY_DIR: "${ARRMADA_LIBRARY_DIR:-/media/library}"
      # Where the download client writes files (default scan dir for manual import).
      # Set ARRMADA_DOWNLOADS_DIR in .env to land downloads on your array (same
      # filesystem as the library, so imports hardlink).
      ARRMADA_DOWNLOADS_DIR: "${ARRMADA_DOWNLOADS_DIR:-/media/downloads}"
      # Optional: point Movies / TV / Books at separate library folders (empty = use the
      # shared library above). See docker-compose.override.example.yml to bind existing
      # folders read-only.
      ARRMADA_MOVIES_DIR: "${ARRMADA_MOVIES_DIR:-}"
      ARRMADA_TV_DIR: "${ARRMADA_TV_DIR:-}"
      ARRMADA_EBOOKS_DIR: "${ARRMADA_EBOOKS_DIR:-}"
      ARRMADA_AUDIOBOOKS_DIR: "${ARRMADA_AUDIOBOOKS_DIR:-}"
      ARRMADA_MUSIC_DIR: "${ARRMADA_MUSIC_DIR:-}"
      # Movie/TV metadata. Get a free v3 API key from https://www.themoviedb.org/settings/api
      ARRMADA_TMDB_API_KEY: "${ARRMADA_TMDB_API_KEY:-}"
      ARRMADA_OMDB_API_KEY: "${ARRMADA_OMDB_API_KEY:-}"
      ARRMADA_HARDCOVER_API_KEY: "${ARRMADA_HARDCOVER_API_KEY:-}"
      # Incoming BitTorrent port — Arrmada applies this inside qBittorrent so it
      # matches the published port above. Same source (.env) as the ports block.
      ARRMADA_QBIT_PORT: "${ARRMADA_QBIT_PORT:-6881}"
      # Run as this user/group. On Unraid, set ARRMADA_PUID=99 / ARRMADA_PGID=100 in .env
      # so the app owns its appdata and can read your media. qBittorrent uses the same.
      PUID: "${ARRMADA_PUID:-1000}"
      PGID: "${ARRMADA_PGID:-1000}"
    volumes:
      # App database/config. Defaults to a managed Docker volume; set ARRMADA_DATA_HOST in
      # .env to a host path (e.g. /mnt/user/appdata/arrmada on Unraid) to keep it in appdata.
      - ${ARRMADA_DATA_HOST:-arrmada-data}:/data
      # Media (downloads + library) at /media. Defaults to a managed Docker volume; set
      # ARRMADA_MEDIA_HOST in .env to a host folder (e.g. /mnt/user/data) to keep it there
      # instead. Every service below that shares media mounts the same line, so a file's path
      # is the same in each and imports hardlink. Never the ARRMADA_DATA_HOST folder.
      # install.sh's --media mounts your own folder at /storage instead (its
      # docker-compose.override.yml; see docker-compose.override.example.yml).
      - ${ARRMADA_MEDIA_HOST:-arrmada-media}:/media
      # The optional bundled SABnzbd's config, read-only: Arrmada reads its API key from
      # here, so the key is never in .env. Empty (and unused) while SABnzbd isn't switched on.
      - arrmada-sab-config:/bundled/sabnzbd:ro
    depends_on:
      arrmada-media-init:
        condition: service_completed_successfully
      arrmada-qbittorrent:
        condition: service_started
      arrmada-flaresolverr:
        condition: service_started
    restart: unless-stopped

  # One-shot: create the media subfolders and hand them to the user both Arrmada and
  # qBittorrent run as, so both can write and hardlink. The managed volume is Arrmada's own,
  # so all of it changes owner. A folder of yours (ARRMADA_MEDIA_HOST) keeps its owners:
  # only the folders made here are handed over, and it may not be the database's folder.
  arrmada-media-init:
    image: alpine:3.20
    container_name: Arrmada-media-init
    environment:
      PUID: "${ARRMADA_PUID:-1000}"
      PGID: "${ARRMADA_PGID:-1000}"
      MEDIA_HOST: "${ARRMADA_MEDIA_HOST:-}"
      DATA_HOST: "${ARRMADA_DATA_HOST:-}"
    command:
      - sh
      - -c
      - |
        case "$$MEDIA_HOST" in
          /* | ./* | ../* | \~*) ;;
          *)
            mkdir -p /media/downloads/incomplete /media/library &&
              chown -R "$$PUID:$$PGID" /media
            exit ;;
        esac
        m=$${MEDIA_HOST%/}; d=$${DATA_HOST%/}; overlap=""
        if [ -n "$$d" ]; then
          case "$$m/" in "$$d/"*) overlap=1 ;; esac
          case "$$d/" in "$$m/"*) overlap=1 ;; esac
        fi
        if [ -n "$$overlap" ]; then
          echo "ARRMADA_MEDIA_HOST ($$m) and ARRMADA_DATA_HOST ($$d) overlap. Media never goes in the database's folder: point ARRMADA_MEDIA_HOST at another folder in .env." >&2
          exit 1
        fi
        [ -n "$$(ls -A /media)" ] || chown "$$PUID:$$PGID" /media
        for p in /media/downloads /media/downloads/incomplete /media/library; do
          [ -d "$$p" ] || { mkdir "$$p" && chown "$$PUID:$$PGID" "$$p"; } || exit 1
        done
    volumes:
      - ${ARRMADA_MEDIA_HOST:-arrmada-media}:/media
    restart: "no"

  # One-shot: seed qBittorrent's config the first time (downloads path, and login-free
  # access from the private Docker network just until Arrmada first starts and replaces it
  # with a password of its own) so Arrmada connects with no setup.
  arrmada-qbittorrent-init:
    image: alpine:3.20
    container_name: Arrmada-qbittorrent-init
    command: >
      sh -c "mkdir -p /config/qBittorrent &&
             [ -f /config/qBittorrent/qBittorrent.conf ] ||
             cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf"
    volumes:
      - arrmada-qbt-config:/config
      - ./docker/qbittorrent:/seed:ro
    restart: "no"

  arrmada-qbittorrent:
    # Pinned so a fresh install gets a known-good version; bump deliberately.
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: Arrmada-qbittorrent
    environment:
      PUID: "${ARRMADA_PUID:-1000}"
      PGID: "${ARRMADA_PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      WEBUI_PORT: "8080"
    volumes:
      - arrmada-qbt-config:/config
      # Same shared media volume, same path as Arrmada — so a file's path is
      # identical in both containers and hardlinks resolve.
      - ${ARRMADA_MEDIA_HOST:-arrmada-media}:/media
    ports:
      # qBittorrent's own WebUI ← .env (install.sh auto-picks a free host port so it
      # won't clash with an existing qBit on 8080). Arrmada manages qBit over the
      # internal Docker network, so you rarely need this — it's just for a direct peek.
      # It asks for the login Arrmada made: an admin sees it on qBittorrent's card in
      # Settings → Connections ("Show its login").
      - "${ARRMADA_QBIT_WEBUI_PORT:-8080}:8080"
      # BitTorrent incoming-connection port, TCP *and* UDP (peers + DHT/uTP). Set
      # once in .env (ARRMADA_QBIT_PORT — the install script picks a random one);
      # Arrmada auto-applies the same value inside qBittorrent, so the two always
      # match. Forward this port on your router to this Docker host.
      - "${ARRMADA_QBIT_PORT:-6881}:${ARRMADA_QBIT_PORT:-6881}"
      - "${ARRMADA_QBIT_PORT:-6881}:${ARRMADA_QBIT_PORT:-6881}/udp"
    depends_on:
      arrmada-qbittorrent-init:
        condition: service_completed_successfully
      arrmada-media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # OPTIONAL indexer manager (Prowlarr). NOT started by default — opt in with:
  #     ./install.sh --with-prowlarr        (or: docker compose --profile prowlarr up -d)
  # Then add your trackers at its WebUI (port ← ARRMADA_PROWLARR_PORT) and click
  # "Sync from Prowlarr" in Arrmada → Indexers. Point Prowlarr's FlareSolverr proxy at
  # http://arrmada-flaresolverr:8191 for Cloudflare-protected trackers.
  arrmada-prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: Arrmada-prowlarr
    profiles: ["prowlarr"]
    environment:
      PUID: "${ARRMADA_PUID:-1000}"
      PGID: "${ARRMADA_PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - arrmada-prowlarr-config:/config
    ports:
      - "${ARRMADA_PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped

  # OPTIONAL Usenet downloader (SABnzbd). NOT started by default — opt in with:
  #     ./install.sh --with-sabnzbd        (or: docker compose --profile sabnzbd up -d)
  # Arrmada registers it by itself, with its categories and folders. You add your Usenet
  # provider in SABnzbd's own page (port ← ARRMADA_SABNZBD_PORT) → Config → Servers, and
  # your Newznab indexers in Arrmada. Downloads go under the shared downloads folder, so
  # imports are a rename on the same filesystem rather than a copy.
  arrmada-sabnzbd:
    # Pinned so a fresh install gets a known-good version; bump deliberately.
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: Arrmada-sabnzbd
    profiles: ["sabnzbd"]
    environment:
      PUID: "${ARRMADA_PUID:-1000}"
      PGID: "${ARRMADA_PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - arrmada-sab-config:/config
      # Same shared media volume, same path as Arrmada, like qBittorrent.
      - ${ARRMADA_MEDIA_HOST:-arrmada-media}:/media
    ports:
      - "${ARRMADA_SABNZBD_PORT:-8085}:8080"
    depends_on:
      arrmada-sabnzbd-init:
        condition: service_completed_successfully
      arrmada-media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot, with SABnzbd: its first settings, only if it has none yet — English (its
  # failure reasons are read by Arrmada), Arrmada's categories with folders of their own,
  # downloads on the shared volume (Arrmada moves them into its Downloads folder once it
  # sees SABnzbd can reach that), the name Arrmada uses for it allowed, every job repaired,
  # unpacked and deleted after (pp=3), and a new random API key. Arrmada reads the key from
  # the config volume; it isn't printed or written anywhere else.
  arrmada-sabnzbd-init:
    image: alpine:3.20
    container_name: Arrmada-sabnzbd-init
    profiles: ["sabnzbd"]
    environment:
      PUID: "${ARRMADA_PUID:-1000}"
      PGID: "${ARRMADA_PGID:-1000}"
    command:
      - sh
      - -c
      - |
        f=/config/sabnzbd.ini
        [ -f "$$f" ] && exit 0
        key=$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        nzb=$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        [ "$${#key}" = 32 ] && [ "$${#nzb}" = 32 ] || exit 1
        umask 077
        cat > "$$f.new" <<EOF
        __version__ = 19
        __encoding__ = utf-8
        [misc]
        language = en
        api_key = $$key
        nzb_key = $$nzb
        host_whitelist = arrmada-sabnzbd,
        download_dir = /media/downloads/usenet/incomplete
        complete_dir = /media/downloads/usenet/complete
        auto_browser = 0
        [categories]
        [[*]]
        name = *
        order = 0
        pp = 3
        script = None
        dir = ""
        newzbin = ""
        priority = 0
        [[arrmada]]
        name = arrmada
        order = 1
        pp = 3
        script = Default
        dir = movies
        newzbin = ""
        priority = -100
        [[arrmada-tv]]
        name = arrmada-tv
        order = 2
        pp = 3
        script = Default
        dir = tv
        newzbin = ""
        priority = -100
        [[arrmada-books]]
        name = arrmada-books
        order = 3
        pp = 3
        script = Default
        dir = books
        newzbin = ""
        priority = -100
        [[arrmada-music]]
        name = arrmada-music
        order = 4
        pp = 3
        script = Default
        dir = music
        newzbin = ""
        priority = -100
        EOF
        chown "$$PUID:$$PGID" /config "$$f.new" && mv "$$f.new" "$$f"
    volumes:
      - arrmada-sab-config:/config
    restart: "no"

  # Solves Cloudflare challenges for protected trackers (e.g. TorrentLeech), the
  # same way Prowlarr uses it. Headless-Chromium image (~1 GB). NO host port is
  # published — only Arrmada talks to it, over the internal Docker network — so it
  # can never clash with an existing FlareSolverr on 8191.
  arrmada-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: Arrmada-flaresolverr
    environment:
      LOG_LEVEL: "info"
      TZ: "${TZ:-Etc/UTC}"
    expose:
      - "8191"
    restart: unless-stopped

volumes:
  arrmada-data:
  arrmada-media:
  arrmada-qbt-config:
  arrmada-prowlarr-config:
  arrmada-sab-config:
