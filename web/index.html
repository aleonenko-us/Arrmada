<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arrmada</title>
    <!-- The remembered theme (lib/theme.ts), stamped before the stylesheet paints anything,
         so a reload doesn't flash the other theme. If a Content-Security-Policy is ever
         added, this script needs its sha256 in script-src. -->
    <script>
      try { var t = localStorage.getItem("arrmada.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- lib/theme.ts keeps this in step with the theme showing; dark until then. -->
    <meta name="theme-color" content="#1f1812" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS ignores an SVG touch icon and screenshots the page instead. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arrmada" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
