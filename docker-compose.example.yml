  #       language = en
  #       api_key = $$key
  #       nzb_key = $$nzb
  #       host_whitelist = arrmada-sabnzbd,
  #       download_dir = /media/downloads/usenet/incomplete
  #       complete_dir = /media/downloads/usenet/complete
  #       auto_browser = 0
  #       [categories]
  #       [[*]]
  #       name = *
  #       order = 0
  #       pp = 3
  #       script = None
  #       dir = ""
  #       newzbin = ""
