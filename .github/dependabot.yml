# Dependabot: weekly version-update PRs, one per ecosystem for all minor and patch bumps
# together (major bumps come one PR each, so a breaking change is looked at on its own).
# CI runs on every one of them; nothing merges itself.
#
# Security updates are separate: once "Dependabot security updates" is on in the repo's
# settings, GitHub opens a PR for a vulnerable dependency as soon as an advisory lands,
# whatever the schedule and limits below say.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Dockerfile's base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Go patches only. A new Go release (1.26 -> 1.27) is a deliberate change: go.mod's
      # go line and CI's setup-go version move with it.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Node major is kept in step with CI's NODE_VERSION, and odd majors aren't LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
